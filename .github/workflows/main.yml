name: Build and Release (Main)

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-gnu
            artifact_name: mini-agent-linux-x86_64
            bin_name: mini

    runs-on: self-hosted
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe

      - name: Rename and compress binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mv zig-out/bin/${{ matrix.bin_name }} ${{ matrix.artifact_name }}
          chmod +x ${{ matrix.artifact_name }}
          tar -czf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}

      - name: Rename and compress binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mv zig-out\bin\${{ matrix.bin_name }} ${{ matrix.artifact_name }}.exe
          Compress-Archive -Path ${{ matrix.artifact_name }}.exe -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Create or Update Nightly Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -d nightly || true
          git push origin :nightly || true
          git tag nightly
          git push origin nightly

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: nightly
          name: "Development Build (Nightly)"
          body: "Tự động cập nhật từ nhánh main."
          prerelease: true
          files: |
            ${{ matrix.artifact_name }}.tar.gz
            ${{ matrix.artifact_name }}.zip
