name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build and Release
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-linux-gnu
            artifact_name: mini-agent-linux-x86_64
            bin_name: mini
          - os: ubuntu-latest
            target: aarch64-linux-gnu
            artifact_name: mini-agent-linux-aarch64
            bin_name: mini
          - os: macos-latest
            target: aarch64-macos
            artifact_name: mini-agent-macos-aarch64
            bin_name: mini
          - os: macos-13
            target: x86_64-macos
            artifact_name: mini-agent-macos-x86_64
            bin_name: mini
          - os: windows-latest
            target: x86_64-windows
            artifact_name: mini-agent-windows-x86_64
            bin_name: mini.exe

    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build
        run: zig build -Dtarget=${{ matrix.target }} -Doptimize=ReleaseSafe

      - name: Rename and compress binary (Unix)
        if: runner.os != 'Windows'
        run: |
          mv zig-out/bin/${{ matrix.bin_name }} ${{ matrix.artifact_name }}
          chmod +x ${{ matrix.artifact_name }}
          tar -czf ${{ matrix.artifact_name }}.tar.gz ${{ matrix.artifact_name }}

      - name: Rename and compress binary (Windows)
        if: runner.os == 'Windows'
        run: |
          mv zig-out\bin\${{ matrix.bin_name }} ${{ matrix.artifact_name }}.exe
          Compress-Archive -Path ${{ matrix.artifact_name }}.exe -DestinationPath ${{ matrix.artifact_name }}.zip

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}.*
